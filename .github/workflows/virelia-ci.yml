name: Virelia CI

on:
  push:
    branches:
      - chatgpt/virelia-finalisation
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_BUILD_PLACEHOLDER
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_BUILD_PLACEHOLDER
      SUPABASE_SERVICE_ROLE_KEY: BUILD_ONLY_PLACEHOLDER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
